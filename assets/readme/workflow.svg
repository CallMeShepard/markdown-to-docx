<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Markdown to DOCX processing flow</title>
  <desc id="desc">Markdown is processed locally by the browser and Pyodide. One path builds a DOCX file with python-docx and native OMML equations; another renders a sanitized live preview with Marked and MathJax.</desc>
  <rect width="1200" height="360" fill="#101216"/>
  <text x="48" y="48" fill="#A6ABB5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">PROCESSING OVERVIEW</text>
  <text x="48" y="88" fill="#F1F0EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="650">One input. Two browser-side paths.</text>
  <path d="M48 113H1152" stroke="#343943" stroke-width="1"/>

  <g id="docx-pipeline">
    <text x="48" y="151" fill="#8F95A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5">DOCUMENT GENERATION</text>
    <rect x="48" y="170" width="190" height="86" fill="#1A1E25" stroke="#555C69" stroke-width="1"/>
    <text x="68" y="204" fill="#F1F0EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Markdown</text>
    <text x="68" y="231" fill="#9EA5B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">source text</text>

    <path d="M238 213H278" stroke="#858B96" stroke-width="1.5"/><path d="M270 207L278 213L270 219" fill="none" stroke="#858B96" stroke-width="1.5"/>
    <rect x="282" y="170" width="190" height="86" fill="#1A1E25" stroke="#555C69" stroke-width="1"/>
    <text x="302" y="204" fill="#F1F0EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Text rules</text>
    <text x="302" y="231" fill="#9EA5B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">normalize · parse</text>

    <path d="M472 213H512" stroke="#858B96" stroke-width="1.5"/><path d="M504 207L512 213L504 219" fill="none" stroke="#858B96" stroke-width="1.5"/>
    <rect x="516" y="170" width="190" height="86" fill="#1A1E25" stroke="#7066E8" stroke-width="1.5"/>
    <text x="536" y="204" fill="#F1F0EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Pyodide</text>
    <text x="536" y="231" fill="#B7B1FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Python in WebAssembly</text>

    <path d="M706 213H746" stroke="#858B96" stroke-width="1.5"/><path d="M738 207L746 213L738 219" fill="none" stroke="#858B96" stroke-width="1.5"/>
    <rect x="750" y="170" width="190" height="86" fill="#1A1E25" stroke="#555C69" stroke-width="1"/>
    <text x="770" y="204" fill="#F1F0EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">DOCX builder</text>
    <text x="770" y="231" fill="#9EA5B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">python-docx · OMML</text>

    <path d="M940 213H980" stroke="#858B96" stroke-width="1.5"/><path d="M972 207L980 213L972 219" fill="none" stroke="#858B96" stroke-width="1.5"/>
    <rect x="984" y="170" width="168" height="86" fill="#E9E8E1"/>
    <text x="1004" y="204" fill="#171A20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="650">.docx</text>
    <text x="1004" y="231" fill="#555C66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">download</text>
  </g>

  <path d="M48 281H1152" stroke="#343943" stroke-width="1"/>
  <g id="preview-pipeline">
    <text x="48" y="314" fill="#8F95A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5">LIVE PREVIEW</text>
    <text x="250" y="314" fill="#D5D8DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Marked</text>
    <path d="M337 308H350M345 303L350 308L345 313" fill="none" stroke="#7066E8" stroke-width="1.6"/>
    <text x="367" y="314" fill="#D5D8DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">DOMPurify</text>
    <path d="M472 308H485M480 303L485 308L480 313" fill="none" stroke="#7066E8" stroke-width="1.6"/>
    <text x="502" y="314" fill="#D5D8DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">MathJax</text>
    <path d="M586 308H599M594 303L599 308L594 313" fill="none" stroke="#7066E8" stroke-width="1.6"/>
    <text x="616" y="314" fill="#D5D8DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">rendered preview + review highlights</text>
    <text x="1152" y="314" fill="#8F95A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">NO APP BACKEND</text>
  </g>
</svg>
